<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Tuition Assistant</title>
  <style>
    :root {
      --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #667085; --border: #e3e6ec;
      --accent: #2f5bd3; --accent-text: #ffffff; --user: #e8eefc; --ok: #1f8a4c; --fail: #c4352b; --warn-bg: #fff7e6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151c; --panel: #1b1f29; --text: #e6e9ef; --muted: #98a2b3; --border: #2c3240;
        --accent: #6b8cff; --accent-text: #0d1020; --user: #24304d; --ok: #4cc38a; --fail: #ff7b72; --warn-bg: #2b2414;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    .app { max-width: 820px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 0 16px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 18px; margin: 0; }
    header .who { color: var(--muted); font-size: 14px; }
    button { font: inherit; border: 0; border-radius: 8px; padding: 9px 16px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button:disabled { opacity: .5; cursor: default; }
    input, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; width: 100%; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    #login { max-width: 380px; margin: 64px auto; display: grid; gap: 12px; }
    #login p { margin: 0; color: var(--muted); font-size: 14px; }
    .error { color: var(--fail); font-size: 14px; min-height: 1.2em; }
    #chat { flex: 1; display: none; flex-direction: column; }
    #log { flex: 1; padding: 16px 0; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; background: var(--user); }
    .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
    .msg.system { align-self: center; color: var(--muted); font-size: 13px; }
    .msg.confirm { background: var(--warn-bg); font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
    .actions { display: flex; gap: 8px; margin-top: 10px; font-family: system-ui, sans-serif; }
    details { margin-top: 8px; font-size: 13px; color: var(--muted); white-space: normal; }
    details pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; margin: 6px 0 0; }
    .step { margin-top: 6px; }
    .step b.ok { color: var(--ok); } .step b.fail { color: var(--fail); }
    form.composer { display: flex; gap: 8px; padding: 12px 0 20px; position: sticky; bottom: 0; background: var(--bg); }
    form.composer textarea { resize: none; height: 44px; }
    .hint { color: var(--muted); font-size: 13px; text-align: center; padding-bottom: 8px; }
    .msg.welcome { align-self: stretch; max-width: none; background: var(--user); border: 1px solid var(--border); }
    .msg.welcome strong { font-size: 16px; }
    #suggestions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 4px 0 8px; }
    #suggestions[hidden] { display: none; }
    #suggestions .label { color: var(--muted); font-size: 13px; margin-right: 4px; }
    button.chip { background: var(--panel); color: var(--accent); border: 1px solid var(--accent); border-radius: 999px;
      padding: 6px 12px; font-size: 13px; text-align: left; }
    button.chip:hover { background: var(--user); }
    .notice { background: var(--warn-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
    .notice a { color: var(--accent); }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>AI Tuition Assistant</h1>
    <div><span class="who" id="who"></span> <button class="secondary" id="logout" hidden>Log out</button></div>
  </header>

  <form class="card" id="login">
    <p>Log in with your student number. The assistant can only see and pay your own tuition.</p>
    <input id="username" placeholder="Student number" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <div class="error" id="login-error"></div>
    <div class="notice" id="staff-notice" hidden></div>
  </form>

  <section id="chat">
    <div id="log"></div>
    <div id="suggestions" hidden></div>
    <div class="hint">Ask about deadlines, installments, refunds or your balance. Every answer shows the tools the assistant used.</div>
    <form class="composer" id="composer">
      <textarea id="message" placeholder="Type your question…" maxlength="1000"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </section>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }

  // Minimal formatting for model answers: **bold**, `code` and "* " bullets. Everything is escaped first.
  function format(text) {
    return escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/^\s*[*-] /gm, '• ');
  }

  function add(kind, html) {
    const div = document.createElement('div');
    div.className = `msg ${kind}`;
    div.innerHTML = html;
    $('log').appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return div;
  }

  function traceHtml(steps, confirmation) {
    if (!steps.length && !confirmation) {
      return '<details><summary>Tool trace: no tools used</summary></details>';
    }
    const items = steps.map((s) =>
      `<div class="step"><b class="${s.ok ? 'ok' : 'fail'}">${s.ok ? '✔' : '✖'}</b> <strong>${escapeHtml(s.tool)}</strong> ` +
      `<code>${escapeHtml(JSON.stringify(s.input))}</code> · ${s.durationMs} ms` +
      `<pre>${escapeHtml(JSON.stringify(s.output, null, 2))}</pre></div>`).join('');
    const gate = confirmation ? `<div class="step">Confirmation gate: <strong>${confirmation.decision}</strong></div>` : '';
    const tools = steps.map((s) => escapeHtml(s.tool.split(' ')[0])).join(', ') || 'no tools used';
    const decision = confirmation ? ` · confirmation ${confirmation.decision.toLowerCase()}` : '';
    return `<details><summary>Tool trace: ${tools}${decision}</summary>${items}${gate}</details>`;
  }

  // Example questions (the assignment's example conversations) and follow-ups chosen by the tools the
  // last answer used. They are only suggestions in the page; the LLM still decides which tools to call.
  const PAY_EXAMPLE = 'Pay part of my balance: 500 dollars for Fall 2026.';
  const SUGGESTIONS = {
    start: ['When is the payment deadline?', 'What is my balance?', 'Can I pay my outstanding balance in installments?', PAY_EXAMPLE],
    policy: ['What is my balance?', 'Can I pay my outstanding balance in installments?', 'How much is the late fee?'],
    balance: ['Can I pay my outstanding balance in installments?', 'When is the payment deadline?', PAY_EXAMPLE],
    both: [PAY_EXAMPLE, 'What happens if I pay after the deadline?', 'Can I get a refund if I withdraw?'],
    paid: ['What is my balance?', 'When will my payment show on my balance?'],
  };

  function showSuggestions(list, label, exclude) {
    const box = $('suggestions');
    const items = list.filter((text) => text !== exclude);
    box.innerHTML = '';
    box.hidden = items.length === 0;
    if (box.hidden) return;
    const caption = document.createElement('span');
    caption.className = 'label';
    caption.textContent = label;
    box.appendChild(caption);
    for (const text of items) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = text;
      chip.onclick = () => { if (!$('send').disabled) send(text); };
      box.appendChild(chip);
    }
  }

  function followUps(data) {
    if (data.pendingPayment) return [];
    if (data.confirmation && data.confirmation.decision === 'CONFIRMED') return SUGGESTIONS.paid;
    const tools = data.steps.map((s) => s.tool.split(' ')[0]);
    const policy = tools.includes('search_tuition_policies');
    const balance = tools.includes('get_my_tuition');
    if (policy && balance) return SUGGESTIONS.both;
    if (policy) return SUGGESTIONS.policy;
    if (balance) return SUGGESTIONS.balance;
    return SUGGESTIONS.start;
  }

  async function call(path, body) {
    const res = await fetch(path, {
      method: body === undefined ? 'GET' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  function showChat(studentNo, again = false) {
    $('login').style.display = 'none';
    $('chat').style.display = 'flex';
    $('who').textContent = `Student ${studentNo}`;
    $('logout').hidden = false;
    add('welcome',
      `<strong>Welcome${again ? ' back' : ''}, student ${escapeHtml(studentNo)}!</strong><br>` +
      'I can answer questions about tuition deadlines, installments, late fees and refunds from the university policy, ' +
      'and show or pay your own tuition. Every answer shows the tools I used.');
    showSuggestions(SUGGESTIONS.start, 'Try asking:');
    $('message').focus();
  }

  async function send(text) {
    $('suggestions').hidden = true;
    add('user', escapeHtml(text));
    $('send').disabled = true;
    const waiting = add('system', 'Thinking…');
    const { ok, status, data } = await call('/api/chat', { message: text });
    waiting.remove();
    $('send').disabled = false;
    if (status === 401) {
      location.reload();
      return;
    }
    if (!ok) {
      add('system', escapeHtml(data.message || 'Something went wrong.'));
      showSuggestions(SUGGESTIONS.start, 'Try asking:');
      return;
    }
    const div = add(data.pendingPayment ? 'assistant confirm' : 'assistant', format(data.reply) + traceHtml(data.steps, data.confirmation));
    if (data.pendingPayment) {
      // The buttons only send the reply; the agent decides in code whether it is a confirmation.
      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.innerHTML = '<button>Confirm payment</button><button class="secondary">Cancel</button>';
      const [yes, no] = actions.querySelectorAll('button');
      const answer = (reply) => { yes.disabled = no.disabled = true; send(reply); };
      yes.onclick = () => answer('yes');
      no.onclick = () => answer('cancel');
      div.appendChild(actions);
    }
    showSuggestions(followUps(data), 'You might also ask:', text);
  }

  $('login').addEventListener('submit', async (event) => {
    event.preventDefault();
    $('login-error').textContent = '';
    $('staff-notice').hidden = true;
    const { ok, data } = await call('/api/login', { username: $('username').value, password: $('password').value });
    $('password').value = '';
    if (!ok && data.error === 'NOT_A_STUDENT') {
      // Admin and bank accounts are greeted and pointed to the API instead of the student chat.
      const notice = $('staff-notice');
      notice.textContent = data.message;
      if (typeof data.swaggerUrl === 'string' && /^https?:\/\//.test(data.swaggerUrl)) {
        const link = document.createElement('a');
        link.href = data.swaggerUrl;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = 'Open Swagger UI';
        notice.append(' ', link);
      }
      notice.hidden = false;
      return;
    }
    if (!ok) {
      $('login-error').textContent = data.message || 'Login failed.';
      return;
    }
    showChat(data.studentNo);
  });

  $('composer').addEventListener('submit', (event) => {
    event.preventDefault();
    const text = $('message').value.trim();
    if (text && !$('send').disabled) {
      $('message').value = '';
      send(text);
    }
  });

  $('message').addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      $('composer').requestSubmit();
    }
  });

  $('logout').addEventListener('click', async () => {
    await call('/api/logout', {});
    location.reload();
  });

  call('/api/session').then(({ ok, data }) => ok && showChat(data.studentNo, true));
</script>
</body>
</html>

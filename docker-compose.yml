services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tuition
      POSTGRES_USER: tuition
      POSTGRES_PASSWORD: tuition
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuition -d tuition"]
      interval: 5s
      timeout: 5s
      retries: 10

  tuition-api:
    build:
      context: .
      dockerfile: apps/tuition-api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tuition:tuition@postgres:5432/tuition?schema=public
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    env_file: .env
    environment:
      PORT: "3001"

  kong:
    # Kong OSS 3.9 with gateway/kong.yml baked in (see gateway/Dockerfile).
    build:
      context: ./gateway
    environment:
      # Only the JWT secret is passed (from .env); render-config.sh writes it into the config at start.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    depends_on:
      - tuition-api

volumes:
  postgres_data:

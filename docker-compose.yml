services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tuition
      POSTGRES_USER: tuition
      POSTGRES_PASSWORD: tuition
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuition -d tuition"]
      interval: 5s
      timeout: 5s
      retries: 10

  tuition-api:
    build:
      context: .
      dockerfile: apps/tuition-api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tuition:tuition@postgres:5432/tuition?schema=public
      PORT: "3000"
      # Load the demo data on the first start (only while the database is empty).
      SEED_ON_START: "true"
    depends_on:
      postgres:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    environment:
      PORT: "3001"
      # Clients (the agent) must send this value in the x-api-key header.
      MCP_API_KEY: ${MCP_API_KEY:?set MCP_API_KEY in .env}
    ports:
      # Reached directly by the agent; the MCP path does not go through the API gateway.
      - "3001:3001"

  chat:
    # Web chat: the agent behind a small HTTP server (http://localhost:8080).
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    environment:
      PORT: "8080"
      GATEWAY_URL: http://kong:8000
      MCP_URL: http://mcp-server:3001/mcp
      MCP_API_KEY: ${MCP_API_KEY:?set MCP_API_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.6-flash,gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3.1-flash-lite}
    ports:
      - "8080:8080"
    depends_on:
      - kong
      - mcp-server

  kong:
    # Kong OSS 3.9 with gateway/kong.yml baked in (see gateway/Dockerfile).
    build:
      context: ./gateway
    environment:
      # Only the JWT secret is passed (from .env); render-config.sh writes it into the config at start.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    depends_on:
      - tuition-api

volumes:
  postgres_data:
